# This rule is not used by the project database-tenant-opr8r itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to db.sproutdb.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: database-tenant-opr8r
    app.kubernetes.io/managed-by: kustomize
  name: sprout-viewer-role
rules:
- apiGroups:
  - db.sproutdb.dev
  resources:
  - sprouts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - db.sproutdb.dev
  resources:
  - sprouts/status
  verbs:
  - get
