---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sprouts.db.sproutdb.dev
spec:
  group: db.sproutdb.dev
  names:
    kind: Sprout
    listKind: SproutList
    plural: sprouts
    shortNames:
    - spr
    singular: sprout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.databaseName
      name: Database
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Sprout is the Schema for the sprouts API. Each Sprout represents one
          isolated logical database, provisioned fresh (schema and data both
          start empty) on an existing target instance for something like a PR
          preview environment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Sprout
            properties:
              connection:
                description: |-
                  connection describes the target database instance and how to
                  authenticate to it as an admin.
                properties:
                  adminDatabase:
                    default: postgres
                    description: |-
                      adminDatabase is the database name used as dbname= when the
                      operator opens its privileged session. Postgres requires a
                      connection to some existing database before it can run CREATE
                      DATABASE; this is that database, not the Sprout's own database
                      and not a template. Defaults to "postgres".
                    maxLength: 63
                    type: string
                  adminSecretRef:
                    description: |-
                      adminSecretRef names a Secret, in the same namespace as this Sprout,
                      holding admin credentials (username/password keys) with enough
                      privilege to create databases, roles, and grants on the target
                      instance. The referenced Secret must already exist; Sprout currently never
                      provisions the underlying database instance itself, it assumes you are
                      bringing your own.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  host:
                    description: host is the network address of the target database
                      instance.
                    type: string
                  port:
                    description: port is the network port of the target database instance.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  sslMode:
                    default: prefer
                    description: |-
                      sslMode is the libpq SSL mode used for both the operator connection
                      and the tenant credentials Secret. Defaults to "prefer": try TLS
                      and fall back if the server has it disabled (typical of local
                      Postgres images).
                    enum:
                    - disable
                    - allow
                    - prefer
                    - require
                    - verify-ca
                    - verify-full
                    type: string
                required:
                - adminSecretRef
                - host
                - port
                type: object
              connectionLimit:
                description: |-
                  connectionLimit caps the number of concurrent connections the
                  tenant's role may hold open. Defaults to 20 when unset.
                format: int32
                minimum: 0
                type: integer
              databaseName:
                description: |-
                  databaseName overrides the logical database name that would
                  otherwise be derived deterministically from this Sprout's namespace
                  and name. Immutable after creation: changing it would orphan the
                  database provisioned under the old name.
                maxLength: 63
                type: string
                x-kubernetes-validations:
                - message: databaseName is immutable
                  rule: self == oldSelf
              provider:
                description: |-
                  provider selects which backend implementation provisions this
                  database. Immutable after creation: changing it would orphan
                  whatever was already provisioned under the old provider.
                enum:
                - postgres
                type: string
                x-kubernetes-validations:
                - message: provider is immutable
                  rule: self == oldSelf
            required:
            - connection
            - provider
            type: object
          status:
            description: status defines the observed state of Sprout
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              databaseName:
                description: |-
                  databaseName is the logical database name actually provisioned on
                  the target instance.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the most recent .metadata.generation the
                  controller has acted on.
                format: int64
                type: integer
              phase:
                type: string
              roleName:
                description: roleName is the login role created for this tenant's
                  credentials.
                type: string
              secretName:
                description: |-
                  secretName is the name of the Secret, in this Sprout's namespace,
                  holding the tenant's connection credentials.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
